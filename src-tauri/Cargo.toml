[package]
name = "legacy-warzone-launcher"
version = "3.0.0"
description = "Legacy Warzone Launcher - Jupiter Mod & IW8 Mod"
authors = ["beanstalk313_16060"]
edition = "2021"

[lib]
name = "legacy_warzone_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "legacy-warzone-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTPS client for the GoFile game download (Jupiter install). Uses rustls
# (no OpenSSL dependency on Windows). `stream` enables chunked body reading
# for real download progress; `json` for the GoFile API responses.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
# Stream utility for reading reqwest's chunked download body.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Website-token generation reproduces GoFile's client-side sha256.
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
