[package]
name = "legacy-warzone-launcher"
version = "1.7.0"
description = "Legacy Warzone Launcher - Jupiter Mod & IW8 Mod"
authors = ["beanstalk313_16060"]
edition = "2021"

[lib]
name = "legacy_warzone_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "legacy-warzone-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
