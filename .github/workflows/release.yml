# Build + publish a GitHub Release (with auto-update artifacts) whenever a
# version tag (v*) is pushed. The updater artifacts (installer .exe + .sig
# signature + latest.json) are generated and attached automatically — the
# app's startup updater check pulls latest.json from the release.
#
# One-time setup (see the README's "Auto-update" section):
#   1. Generate the signing key:        npm run tauri signer generate -- -w ~/.tauri/legacy-warzone-launcher.key
#   2. Add the PUBLIC key (printed by step 1, or publickey.pem) to
#      src-tauri/tauri.conf.json → plugins.updater.pubkey, and set the real
#      repo in plugins.updater.endpoints.
#   3. Add the PRIVATE key as GitHub Actions secrets:
#        TAURI_SIGNING_PRIVATE_KEY          (path or contents of the .key file)
#        TAURI_SIGNING_PRIVATE_KEY_PASSWORD (only if you set one)
#   4. To release: bump the version (src-tauri/tauri.conf.json,
#      src-tauri/Cargo.toml, package.json), commit, then tag and push:
#        git tag v1.8.0 && git push origin v1.8.0

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Supabase creds are inlined into the frontend bundle at build time
          # (src/lib/supabase.js reads import.meta.env.VITE_*). The local .env
          # is gitignored, so without these the GitHub build ships with
          # SUPABASE_CONFIGURED=false and the startup security check fails
          # closed into the "SECURITY CHECK UNAVAILABLE" screen. Values come
          # from repo secrets (Settings → Secrets and variables → Actions),
          # never from committed files. The anon key is a public client key by
          # design (RLS policies are the real gate), so shipping it in the
          # bundle is safe.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Device identity path — baked into the binary at compile time
          # (src-tauri/src/commands.rs reads env!("LWZ_IDENTITY_DIR") /
          # env!("LWZ_IDENTITY_FILE")). The build FAILS without them, so add
          # two repo secrets (Settings → Secrets and variables → Actions):
          #   LWZ_IDENTITY_DIR   the folder the identity file lives in
          #   LWZ_IDENTITY_FILE  the identity file's name — used verbatim,
          #                      no .json (or any extension) is appended
          # Pick values you can keep stable across releases (or rotate now
          # and then); they never appear in this repository.
          LWZ_IDENTITY_DIR: ${{ secrets.LWZ_IDENTITY_DIR }}
          LWZ_IDENTITY_FILE: ${{ secrets.LWZ_IDENTITY_FILE }}
        with:
          tagName: v__VERSION__
          releaseName: 'Legacy Warzone Launcher v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
